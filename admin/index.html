<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111210"><link rel="manifest" href="/admin/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/admin/app-icon.svg"><link rel="apple-touch-icon" href="/admin/app-icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><title>ovth. Owner / Orders</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#111210;color:#e9e2d4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:25px 18px 90px}header,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}header{border-bottom:1px solid #3a3c32;padding-bottom:22px}h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.06em;margin:18px 0}h2{font-size:22px}.brand{font-weight:900;font-size:24px;font-style:italic;letter-spacing:-1px}.muted,small{color:#a5a79b}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{background:#e9e2d4;color:#111210;border:0;border-radius:7px;padding:12px 17px;font-weight:700}.secondary{background:#30332b;color:#e9e2d4}.ghost{background:transparent;color:#e9e2d4;border:1px solid #55584b}.panel{border:1px solid #3a3c32;background:#1d1f1b;border-radius:12px;padding:17px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats strong{display:block;font-size:29px;margin-top:7px}input,select,textarea{background:#272923;color:#f3efe7;border:1px solid #505349;border-radius:7px;padding:12px;width:100%}label{display:block;font-size:12px;color:#b5b6ac;margin:12px 0 5px}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:20px 0}.order{display:block;width:100%;text-align:left;background:#1d1f1b;color:inherit;border:1px solid #393c33;border-radius:10px;padding:16px;margin:8px 0}.order:hover{border-color:#b7b5a6}.tag{font-size:11px;padding:5px 8px;background:#353a31;border-radius:20px;color:#d5dfc8}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.details{margin-top:15px;border-top:1px solid #44483e;padding-top:12px;overflow-wrap:anywhere}.details p{line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.error{color:#f0aaa2}.success{color:#bdd5ad}#message{min-height:24px}a{color:inherit}@media(max-width:580px){.grid,.toolbar{grid-template-columns:1fr}.stats strong{font-size:23px}header .btn{padding:8px}}
</style></head><body><div class="wrap"><header><a class="brand" href="/">ovth.</a><span class="muted">OWNER / ORDERS</span><button class="btn secondary hidden" id="signout">Sign out</button></header>
<section id="login" class="panel"><h1>Owner access.</h1><p class="muted">Sign in with the owner account registered in Supabase Auth. Access is checked by database policies.</p><form id="loginform"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p><button class="btn">Sign in</button></p></form></section>
<section id="dashboard" class="hidden"><h1>Orders.</h1><div class="stats"><div class="panel"><small>All orders</small><strong id="count">0</strong></div><div class="panel"><small>Payment review</small><strong id="pending">0</strong></div><div class="panel"><small>To ship</small><strong id="toship">0</strong></div></div><div class="toolbar"><input id="search" placeholder="Search order, name, email..." aria-label="Search orders"><select id="filter" aria-label="Filter status"><option value="">All statuses</option><option value="new">New</option><option value="preparing">Preparing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div class="between"><h2>Order list</h2><div><button class="btn secondary" id="manualtoggle">+ Instagram order</button> <button class="btn secondary" id="refresh">Refresh</button></div></div><form id="manualform" class="panel hidden"><h2>New Instagram order</h2><div class="grid"><label>Customer name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Product<select name="edition"><option value="road">OVTH-01 / Road</option><option value="trail">OVTH-02 / Trail</option></select></label><label>Color<select name="color"><option>Black</option><option>White</option></select></label><label>Size<select name="size"><option>S</option><option>M</option><option>L</option><option>XL</option></select></label><label>Quantity<input name="qty" type="number" min="1" max="20" value="1" required></label><label>Confirmed unit price (THB)<input name="price" type="number" min="0" step="1" value="590" required></label></div><label>Shipping address<textarea name="address" minlength="10" required></textarea></label><label>Shipping fee (THB)<input name="shipping" type="number" min="0" value="0" required></label><label>Note<textarea name="note"></textarea></label><p><button class="btn">Save manual order</button></p></form><div id="orders"></div></section><p id="message" role="status"></p></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'/overthill-config.js';
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let orders=[],expanded=null;
function message(s,bad=false){$('#message').textContent=s;$('#message').className=bad?'error':'success'}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){$('#login').classList.remove('hidden');$('#dashboard').classList.add('hidden');$('#signout').classList.add('hidden');return}
const {data:owner,error}=await db.from('ovth_owners').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!owner){message('This account is not registered as an OVERTHILL owner.',true);await db.auth.signOut();return init()}
$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#signout').classList.remove('hidden');await load()}
async function load(){const {data,error}=await db.from('ovth_orders').select('*').order('created_at',{ascending:false}).limit(500);if(error)return message(error.message,true);orders=data||[];render();message('Updated '+new Date().toLocaleTimeString())}
const money=n=>'฿'+Number(n||0).toLocaleString('en-US');
function render(){const filter=$('#filter').value,search=$('#search').value.trim().toLowerCase();$('#count').textContent=orders.length;$('#pending').textContent=orders.filter(o=>o.payment_status==='submitted').length;$('#toship').textContent=orders.filter(o=>o.fulfillment_status==='preparing').length;
const list=orders.filter(o=>(!filter||o.fulfillment_status===filter)&&(!search||[o.order_no,o.customer_name,o.customer_email,o.customer_phone].join(' ').toLowerCase().includes(search)));
$('#orders').innerHTML=list.length?list.map(o=>'<article class="order"><button class="order" data-open="'+esc(o.id)+'"><div class="row"><strong>'+esc(o.order_no)+'</strong><span class="tag">'+esc(o.fulfillment_status)+'</span></div><div class="row"><span>'+esc(o.customer_name)+'<br><small>'+esc(o.channel)+' · '+new Date(o.created_at).toLocaleDateString()+'</small></span><strong>'+money(o.subtotal_thb+o.shipping_thb)+'</strong></div></button>'+(expanded===o.id?detail(o):'')+'</article>').join(''):'<p class="muted">No matching orders.</p>'}
function detail(o){const items=(Array.isArray(o.items)?o.items:[]).map(i=>'<li>'+esc(i.code||i.edition)+' / '+esc(i.color)+' / '+esc(i.size)+' × '+esc(i.qty)+'</li>').join('');
return '<div class="details"><p><strong>Contact</strong><br>'+esc(o.customer_name)+'<br><a href="mailto:'+encodeURIComponent(o.customer_email)+'">'+esc(o.customer_email)+'</a><br>'+esc(o.customer_phone)+'</p><p><strong>Shipping address</strong><br>'+esc(o.shipping_address)+'</p><p><strong>Products</strong><ul>'+items+'</ul></p><p>Subtotal: '+money(o.subtotal_thb)+' · Shipping: '+money(o.shipping_thb)+'</p><p>Note: '+esc(o.customer_note||'—')+'</p><div class="grid"><div><label>Payment status</label><select id="payment"><option value="awaiting_payment">Awaiting payment</option><option value="submitted">Submitted</option><option value="verified">Verified</option><option value="rejected">Rejected</option></select></div><div><label>Shipping status</label><select id="fulfillment"><option value="new">New</option><option value="preparing">Preparing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div><label>Courier</label><input id="courier" maxlength="80" placeholder="Flash / J&T / KEX"></div><div><label>Tracking number</label><input id="tracking" maxlength="100"></div><div><label>Tracking mode</label><select id="mode"><option value="manual">Manual</option><option value="etrackings">ETrackings (requires API setup)</option></select></div></div><p><button class="btn" id="save">Save changes</button> <button class="btn secondary" id="mail">Email customer</button></p><small>ETrackings polling is not active until server-side API credentials are configured. Email opens your email app; automated sending requires a verified sender.</small></div>'}
function fill(o){$('#payment').value=o.payment_status;$('#fulfillment').value=o.fulfillment_status;$('#courier').value=o.courier||'';$('#tracking').value=o.tracking_number||'';$('#mode').value=o.tracking_mode||'manual'}
$('#orders').addEventListener('click',async e=>{const open=e.target.closest('[data-open]');if(open){expanded=expanded===open.dataset.open?null:open.dataset.open;render();if(expanded)fill(orders.find(o=>o.id===expanded));return}
const o=orders.find(x=>x.id===expanded);if(!o)return;if(e.target.id==='mail'){const subject='OVERTHILL order '+o.order_no;const body='Hello '+o.customer_name+',\n\nRegarding your order '+o.order_no+'.\nTracking: '+(o.tracking_number||'Pending')+'\n\nOVERTHILL GOODS';location.href='mailto:'+encodeURIComponent(o.customer_email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
if(e.target.id==='save'){const patch={payment_status:$('#payment').value,fulfillment_status:$('#fulfillment').value,courier:$('#courier').value.trim()||null,tracking_number:$('#tracking').value.trim()||null,tracking_mode:$('#mode').value,updated_at:new Date().toISOString()};if(patch.fulfillment_status==='shipped'&&!patch.tracking_number)return message('Enter tracking number before marking shipped.',true);if(patch.payment_status==='verified'&&patch.fulfillment_status==='new')patch.fulfillment_status='preparing';if(patch.fulfillment_status==='shipped'&&!o.shipped_at)patch.shipped_at=new Date().toISOString();if(patch.fulfillment_status==='delivered'&&!o.delivered_at)patch.delivered_at=new Date().toISOString();const {error}=await db.from('ovth_orders').update(patch).eq('id',o.id);if(error)return message(error.message,true);await load()}}
);
$('#loginform').addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return message(error.message,true);await init()});
$('#manualtoggle').onclick=()=>$('#manualform').classList.toggle('hidden');
$('#manualform').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),qty=Number(f.get('qty')),price=Number(f.get('price')),shipping=Number(f.get('shipping'));if(!Number.isInteger(qty)||qty<1||qty>20||!Number.isInteger(price)||price<0||!Number.isInteger(shipping)||shipping<0)return message('Invalid quantity or price.',true);
const row={customer_name:String(f.get('name')).trim(),customer_email:String(f.get('email')).trim(),customer_phone:String(f.get('phone')).trim(),shipping_address:String(f.get('address')).trim(),customer_note:String(f.get('note')).slice(0,1000),channel:'instagram',items:[{code:f.get('edition')==='road'?'OVTH-01':'OVTH-02',edition:f.get('edition'),color:f.get('color'),size:f.get('size'),qty,unit_price_thb:price}],subtotal_thb:qty*price,shipping_thb:shipping};
const {error}=await db.from('ovth_orders').insert(row);if(error)return message(error.message,true);e.target.reset();$('#manualform').classList.add('hidden');await load();message('Instagram order saved.')});
$('#signout').onclick=async()=>{await db.auth.signOut();await init()};$('#refresh').onclick=load;$('#search').oninput=render;$('#filter').onchange=render;init().catch(e=>message(e.message,true));
</script></body></html>
