<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OVERTHILL / IG Lookbook</title><style>*{box-sizing:border-box}body{background:#222;color:#ecebe7;font-family:Arial,sans-serif;margin:0;padding:20px}h1{font-size:18px;letter-spacing:3px}p{font-size:13px;color:#aaa}main{display:flex;flex-wrap:wrap;gap:20px}.poster{position:relative;width:min(100%,540px);aspect-ratio:4/5;background:#0b0b0b;padding:6%;overflow:hidden}.top,.foot{display:flex;justify-content:space-between;font-size:clamp(8px,1.6vw,13px);letter-spacing:2px}.top{border-bottom:1px solid #444;padding-bottom:14px}.foot{border-top:1px solid #444;padding-top:15px}.title{font-size:clamp(40px,8vw,78px);font-weight:900;letter-spacing:-3px;margin:7% 0 0}.sub{font-size:clamp(10px,2vw,16px);letter-spacing:3px;color:#bbb}.shirts{height:59%;display:flex;justify-content:center;align-items:center;gap:2%}.shirts img{width:49%;height:100%;object-fit:contain}.caption{font-size:11px;color:#bbb;letter-spacing:2px;margin:0 0 8px}.item{width:min(100%,540px)}button{background:#ecebe7;color:#111;border:0;padding:13px 17px;font-weight:700;margin:14px 0 24px;cursor:pointer}</style><h1>OVERTHILL / DROP 01</h1><p>Original SVG artwork from this website. Download each card as PNG.</p><main id="main"></main><script>const cards=[['DROP 01','ONE SPIRIT / TWO EDITIONS','OVTH-01-BACK.SVG','OVTH-02-BACK.SVG'],['OVTH—01','ROAD EDITION','OVTH-01-FRONT.SVG','OVTH-01-BACK.SVG'],['OVTH—02','TRAIL EDITION','OVTH-02-FRONT.SVG','OVTH-02-BACK.SVG']];const main=document.querySelector('#main');cards.forEach((c,i)=>{const el=document.createElement('section');el.className='item';el.innerHTML='<div class="caption">0'+(i+1)+' / 03 — ORIGINAL ARTWORK</div><div class="poster"><div class="top"><span>OVERTHILL GOODS</span><span>CHIANG MAI</span></div><div class="title">'+c[0]+'</div><div class="sub">'+c[1]+'</div><div class="shirts"><img src="/img/'+c[2]+'"><img src="/img/'+c[3]+'"></div><div class="foot"><span>RUN / RAN / RUN</span><span>IN DEVELOPMENT</span></div></div><button type="button">DOWNLOAD PNG</button>';main.append(el);el.querySelector('button').onclick=async()=>{const imgs=[...el.querySelectorAll('img')];await Promise.all(imgs.map(img=>img.decode()));const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d');ctx.fillStyle='#0b0b0b';ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#ecebe7';ctx.font='25px Arial';ctx.fillText('OVERTHILL GOODS',65,82);ctx.textAlign='right';ctx.fillText('CHIANG MAI',1015,82);ctx.textAlign='left';ctx.strokeStyle='#555';ctx.beginPath();ctx.moveTo(65,112);ctx.lineTo(1015,112);ctx.stroke();ctx.font='bold 110px Arial';ctx.fillText(c[0],65,260);ctx.font='30px Arial';ctx.fillStyle='#bbb';ctx.fillText(c[1],65,315);for(let j=0;j<2;j++){const img=imgs[j];const maxW=470,maxH=790;const scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight);const w=img.naturalWidth*scale,h=img.naturalHeight*scale;ctx.drawImage(img,55+j*500+(maxW-w)/2,370+(maxH-h)/2,w,h)}ctx.strokeStyle='#555';ctx.beginPath();ctx.moveTo(65,1190);ctx.lineTo(1015,1190);ctx.stroke();ctx.fillStyle='#eee';ctx.font='25px Arial';ctx.fillText('RUN / RAN / RUN',65,1245);ctx.textAlign='right';ctx.fillText('IN DEVELOPMENT',1015,1245);const a=document.createElement('a');a.download='OVERTHILL-0'+(i+1)+'.png';a.href=canvas.toDataURL('image/png');a.click()};});</script></html>
